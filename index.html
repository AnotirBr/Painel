<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Painel de clientes</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#1d2433">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1d2433;--mut:#6b7385;--line:#e2dfd6;--wa:#1faa59;--red:#c8382e;--amb:#b7791f;--blue:#2f5fd0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#151a24;--card:#1e2533;--ink:#eef0f5;--mut:#9aa3b5;--line:#2c3446;--wa:#35c775;--red:#ff7a6e;--amb:#f0b44c;--blue:#7fa2ff}}
:root[data-theme="dark"]{--bg:#151a24;--card:#1e2533;--ink:#eef0f5;--mut:#9aa3b5;--line:#2c3446;--wa:#35c775;--red:#ff7a6e;--amb:#f0b44c;--blue:#7fa2ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font:700 22px/1.2 Georgia,serif;margin:4px 0 14px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sum div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.sum small{color:var(--mut);display:block;font-size:13px}
.sum b{font-size:19px}
.sum .liq{grid-column:1/-1;background:var(--ink);color:var(--bg)}
.sum .liq small{color:inherit;opacity:.7}
.sum .liq b{font-size:26px}
.alerts{margin-bottom:14px}
.al{border-left:4px solid var(--amb);background:var(--card);padding:8px 12px;border-radius:6px;margin-bottom:6px;font-size:15px}
.al.r{border-color:var(--red)}
.bar{display:flex;gap:8px;margin-bottom:10px}
button,input,textarea{font:inherit;color:var(--ink)}
input,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
button{border:1px solid var(--line);background:var(--card);padding:10px 14px;border-radius:8px;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pri{background:var(--blue);border-color:var(--blue);color:#fff}
.cl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px}
.nm{font-weight:700}
.st{font-size:14px;margin-top:2px}
.st.r{color:var(--red)}.st.a{color:var(--amb)}.st.o{color:var(--mut)}
.val{font-weight:700;white-space:nowrap}
.act{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.act button{padding:8px 12px;font-size:15px}
.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
.empty{text-align:center;color:var(--mut);padding:28px 10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:min(92vw,460px);padding:16px}
dialog::backdrop{background:#0008}
label{display:block;font-size:14px;color:var(--mut);margin:10px 0 4px}
.row{display:flex;gap:8px;margin-top:14px;justify-content:flex-end}
</style>
</head>
<body>
<main>
<h1>Painel de clientes</h1>
<div class="sum" id="sum"></div>
<div class="alerts" id="alerts"></div>
<div class="bar">
<button class="pri" id="novo" style="flex:1">Adicionar cliente</button>
<button id="cfg">Configurar</button>
</div>
<div id="lista"></div>
</main>

<dialog id="dc"><form method="dialog" id="fc">
<b id="dt">Novo cliente</b>
<label for="n">Nome</label><input id="n" required>
<label for="t">WhatsApp (com DDD)</label><input id="t" inputmode="tel" placeholder="11 99999-0000" required>
<label for="v">Valor (R$)</label><input id="v" type="number" step="0.01" min="0" required>
<label for="d">Data de pagamento</label><input id="d" type="date" required>
<div class="row"><button type="button" id="x1">Cancelar</button><button class="pri" id="ok">Salvar cliente</button></div>
</form></dialog>

<dialog id="dg"><form method="dialog">
<b>Configurações</b>
<label for="tx">Taxa de manutenção por cliente (R$)</label><input id="tx" type="number" step="0.01" min="0">
<label for="ms">Mensagem de cobrança</label>
<textarea id="ms" rows="5"></textarea>
<small style="color:var(--mut)">Use {nome}, {valor} e {data}; eles são trocados em cada cliente.</small>
<label>Alertas e backup</label>
<div class="act" style="margin-top:0"><button type="button" id="nt">Ativar notificações</button><button type="button" id="ex">Exportar backup</button><button type="button" id="im">Importar backup</button></div>
<input type="file" id="fi" accept="application/json" hidden>
<div class="row"><button type="button" id="x2">Cancelar</button><button class="pri" id="sv">Salvar</button></div>
</form></dialog>

<script>
const $=id=>document.getElementById(id);
const K='painel-clientes-v1';
const MSG0='Olá {nome}, tudo bem? Passando para lembrar que o pagamento de {valor} vence em {data}. Qualquer dúvida, é só me chamar.';
let S={clientes:[],taxa:9,msg:MSG0},edit=null;
try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const hoje=()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),d.getDate())};
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const br=s=>parse(s).toLocaleDateString('pt-BR');
const dias=s=>Math.round((parse(s)-hoje())/864e5);
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function mais1(s){const d=parse(s),dia=d.getDate();const n=new Date(d.getFullYear(),d.getMonth()+1,1);
const ult=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();n.setDate(Math.min(dia,ult));return iso(n)}
function stTxt(c){const n=dias(c.data);
if(n<0)return['r','Atrasado há '+(-n)+(n==-1?' dia':' dias')+' · '+br(c.data)];
if(n==0)return['r','Vence hoje · '+br(c.data)];
if(n==1)return['a','Vence amanhã · '+br(c.data)];
if(n<=3)return['a','Vence em '+n+' dias · '+br(c.data)];
return['o','Vence em '+br(c.data)]}
function render(){
const L=[...S.clientes].sort((a,b)=>a.data.localeCompare(b.data));
const bruto=L.reduce((s,c)=>s+c.valor,0),taxa=L.length*S.taxa;
$('sum').innerHTML=`<div><small>Clientes</small><b>${L.length}</b></div><div><small>Total bruto</small><b>${brl(bruto)}</b></div><div><small>Taxa (${brl(S.taxa)} × ${L.length})</small><b>${brl(taxa)}</b></div><div><small>Pagamentos vencidos</small><b>${L.filter(c=>dias(c.data)<0).length}</b></div><div class="liq"><small>Líquido (bruto menos taxa)</small><b>${brl(bruto-taxa)}</b></div>`;
const A=L.filter(c=>dias(c.data)<=3);
$('alerts').innerHTML=A.map(c=>{const[k,t]=stTxt(c);return`<div class="al ${k=='r'?'r':''}"><b>${esc(c.nome)}</b>: ${t.split(' · ')[0].toLowerCase()} (${brl(c.valor)})</div>`}).join('');
$('lista').innerHTML=L.length?L.map(c=>{const[k,t]=stTxt(c);return`<div class="cl"><div class="top"><div><div class="nm">${esc(c.nome)}</div><div class="st ${k}">${t}</div></div><div class="val">${brl(c.valor)}</div></div><div class="act"><button class="wa" data-a="wa" data-i="${c.id}">Cobrar no WhatsApp</button><button data-a="pg" data-i="${c.id}">Marcar como pago</button><button data-a="ed" data-i="${c.id}">Editar</button><button data-a="rm" data-i="${c.id}">Excluir</button></div></div>`}).join(''):'<div class="empty">Nenhum cliente ainda. Toque em “Adicionar cliente” para começar.</div>'}
function tel(t){let d=t.replace(/\D/g,'');if(d.length<=11)d='55'+d;return d}
function texto(c){return S.msg.replace(/{nome}/g,c.nome.split(' ')[0]).replace(/{valor}/g,brl(c.valor)).replace(/{data}/g,br(c.data))}
$('lista').onclick=e=>{const b=e.target.closest('button');if(!b)return;
const c=S.clientes.find(x=>x.id==b.dataset.i);if(!c)return;
if(b.dataset.a=='wa')window.open('https://wa.me/'+tel(c.tel)+'?text='+encodeURIComponent(texto(c)),'_blank');
if(b.dataset.a=='pg'){c.data=mais1(c.data);save();render()}
if(b.dataset.a=='rm'&&confirm('Excluir '+c.nome+'?')){S.clientes=S.clientes.filter(x=>x!==c);save();render()}
if(b.dataset.a=='ed'){edit=c.id;$('dt').textContent='Editar cliente';$('n').value=c.nome;$('t').value=c.tel;$('v').value=c.valor;$('d').value=c.data;$('dc').showModal()}};
$('novo').onclick=()=>{edit=null;$('dt').textContent='Novo cliente';$('fc').reset();$('d').value=iso(hoje());$('dc').showModal()};
$('x1').onclick=()=>$('dc').close();
$('fc').onsubmit=e=>{if(!$('fc').checkValidity())return;
const o={nome:$('n').value.trim(),tel:$('t').value.trim(),valor:parseFloat($('v').value)||0,data:$('d').value};
if(edit)Object.assign(S.clientes.find(x=>x.id==edit),o);else S.clientes.push({id:Date.now(),...o});
save();render()};
$('cfg').onclick=()=>{$('tx').value=S.taxa;$('ms').value=S.msg;$('dg').showModal()};
$('x2').onclick=()=>$('dg').close();
$('sv').onclick=()=>{S.taxa=parseFloat($('tx').value)||0;S.msg=$('ms').value.trim()||MSG0;save();render()};

$('ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='clientes-'+iso(hoje())+'.json';a.click()};
$('im').onclick=()=>$('fi').click();
$('fi').onchange=async e=>{try{const o=JSON.parse(await e.target.files[0].text());if(!Array.isArray(o.clientes))throw 0;if(confirm('Substituir os dados atuais pelo backup?')){S=Object.assign(S,o);save();render();$('dg').close()}}catch(x){alert('Arquivo de backup inválido.')}e.target.value=''};
$('nt').onclick=async()=>{if(!('Notification' in window)){alert('Este navegador não suporta notificações.');return}
const r=await Notification.requestPermission();$('nt').textContent=r=='granted'?'Notificações ativadas':'Notificações bloqueadas';avisar()};
async function avisar(){if(!('Notification' in window)||Notification.permission!='granted')return;
S.notif=S.notif||{};const h=iso(hoje());
const L=S.clientes.filter(c=>dias(c.data)<=0&&S.notif[c.id]!=h+c.data);
if(!L.length)return;
const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
const body=L.map(c=>c.nome+' ('+brl(c.valor)+')').join(', ');
const t='Pagamentos para cobrar hoje';
try{reg?reg.showNotification(t,{body,icon:'icon.svg',tag:'cobranca'}):new Notification(t,{body})}catch(e){}
L.forEach(c=>S.notif[c.id]=h+c.data);save()}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
if($('nt')&&'Notification' in window&&Notification.permission=='granted')$('nt').textContent='Notificações ativadas';
render();avisar();setInterval(()=>{render();avisar()},600000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){render();avisar()}});
</script>
</body>
</html>
